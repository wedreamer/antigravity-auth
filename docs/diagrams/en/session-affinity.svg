<svg viewBox="0 0 720 640" width="720" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Session sticky account assignment</title>
  <desc id="desc">A session keeps its account while that account is usable. A new session, or a 429, assigns the next available account.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5e5" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="720" height="640" fill="#fafafa"/>
  <rect width="720" height="640" fill="url(#grid)"/>
  <text x="36" y="36" font-family="monospace" font-size="14" fill="#333" font-weight="bold">SESSION AFFINITY</text>
  <text x="230" y="36" font-family="monospace" font-size="12" fill="#666">[ ACCOUNT POOL ]</text>

  <rect x="250" y="64" width="220" height="44" rx="22" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="360" y="91" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">REQUEST</text>
  <path d="M360 108 V140" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="360,148 470,196 360,244 250,196" fill="#fafafa" stroke="#f39c12" stroke-width="2"/>
  <text x="360" y="192" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">BOUND?</text>
  <text x="360" y="208" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">and usable</text>

  <path d="M250 196 H150 V292" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="156" y="186" font-family="monospace" font-size="10" fill="#27ae60">yes</text>
  <path d="M470 196 H570 V292" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="186" font-family="monospace" font-size="10" fill="#e74c3c">no / 429</text>

  <rect x="48" y="292" width="188" height="64" fill="#fafafa" stroke="#27ae60" stroke-width="2"/>
  <text x="142" y="318" font-family="monospace" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">KEEP</text>
  <text x="142" y="338" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">same account</text>

  <rect x="484" y="292" width="188" height="64" fill="#fafafa" stroke="#f39c12" stroke-width="2"/>
  <text x="578" y="318" font-family="monospace" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">ASSIGN</text>
  <text x="578" y="338" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">next available</text>

  <path d="M142 356 V396 H300" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M578 356 V396 H420" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="380" width="220" height="56" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="360" y="404" font-family="monospace" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">CALL</text>
  <text x="360" y="422" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">Antigravity</text>

  <path d="M360 436 V468" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="360,476 470,524 360,572 250,524" fill="#fafafa" stroke="#3498db" stroke-width="2"/>
  <text x="360" y="520" font-family="monospace" font-size="11" fill="#333" text-anchor="middle">RESULT</text>
  <text x="360" y="538" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">200 stays bound</text>

  <text x="360" y="616" font-family="monospace" font-size="11" fill="#666" text-anchor="middle">New sessions spread. One session stays until 429.</text>
</svg>
